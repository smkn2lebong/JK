<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>URC JKN - Pengajuan Pasien</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>🩺 URC JKN - Form Pengajuan Pasien</h1>

    <form id="ajuanForm" enctype="multipart/form-data">

      <h2>Identitas Pasien</h2>
      <label>Nama Pasien</label>
      <input type="text" name="nama" required>

      <label>No KK Pasien</label>
      <input type="text" name="kk" required>

      <label>No NIK Pasien</label>
      <input type="text" name="nik" required>

      <label>No HP Pasien</label>
      <input type="tel" name="hp" required>

      <label>Alamat</label>
      <textarea name="alamat" rows="3" required></textarea>

      <label>Puskesmas Terdekat</label>
      <input type="text" name="puskesmas" required>

      <h2>Berkas Pendukung</h2>
      <label>Upload KK</label>
      <input type="file" name="file_kk" accept=".jpg,.jpeg,.png,.pdf" required>

      <label>Upload KTP</label>
      <input type="file" name="file_ktp" accept=".jpg,.jpeg,.png,.pdf" required>

      <label>Upload Surat Rawat Inap</label>
      <input type="file" name="file_rawat" accept=".jpg,.jpeg,.png,.pdf">

      <label>Upload Surat Keterangan Tidak Mampu</label>
      <input type="file" name="file_tidak_mampu" accept=".jpg,.jpeg,.png,.pdf">

      <h2>Data Relawan</h2>
      <label>Nama Relawan Pengaju</label>
      <input type="text" name="relawan" required>

      <button type="submit">📤 Kirim Ajuan</button>
    </form>

    <div id="loading" style="display:none;">⏳ Mengirim data...</div>
    <div id="success" style="display:none;">
      ✅ Data berhasil dikirim!<br>
      <button id="waButton">📱 Kirim ke WhatsApp Admin</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
